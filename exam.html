<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בוחן מדומה — אתיקה עסקית</title>
<style>
:root{
  --bg:#f7f6f3; --surface:#ffffff; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --accent:#185fa5; --accentSoft:#e8f0f8;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --chipBg:#efeee9; --warn:#b23030;
  --midBg:#fdf6e3; --midBd:#e0cd93;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1a18; --surface:#242421; --text:#ececea; --muted:#a3a39c;
  --border:#37372f; --accent:#5b9bd5; --accentSoft:#22344a;
  --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
  --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
  --chipBg:#2f2f2a; --warn:#e89393;
  --midBg:#3a3320; --midBd:#6b5a2f;
}}
html.dark{--bg:#1a1a18;--surface:#242421;--text:#ececea;--muted:#a3a39c;--border:#37372f;--accent:#5b9bd5;--accentSoft:#22344a;--okBg:#16331f;--okBd:#2f6b3f;--okTx:#7fd49a;--errBg:#3a1d1d;--errBd:#7a3535;--errTx:#e89393;--chipBg:#2f2f2a;--warn:#e89393;--midBg:#3a3320;--midBd:#6b5a2f;}
html.light{--bg:#f7f6f3;--surface:#ffffff;--text:#1f1f1d;--muted:#6b6b66;--border:#e3e1da;--accent:#185fa5;--accentSoft:#e8f0f8;--okBg:#e6f4ea;--okBd:#9bd3ad;--okTx:#1a6b1a;--errBg:#fceaea;--errBd:#e6a3a3;--errTx:#b23030;--chipBg:#efeee9;--warn:#b23030;--midBg:#fdf6e3;--midBd:#e0cd93;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;line-height:1.6;}
.wrap{max-width:780px;margin:0 auto;padding:24px;}
header h1{font-size:24px;margin:0 0 4px;}
header .sub{color:var(--muted);font-size:14px;margin-bottom:16px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin-bottom:14px;color:var(--muted);align-items:center;}
.stats b{color:var(--text);}
.timer{font-size:18px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;}
.timer.low{color:var(--warn);}
.bar{height:8px;background:var(--chipBg);border-radius:999px;overflow:hidden;margin-bottom:18px;}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
.qmeta{font-size:12px;color:var(--muted);margin-bottom:6px;}
.qtext{font-size:18px;font-weight:600;margin-bottom:16px;}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:.12s;background:var(--surface);}
.opt:hover{border-color:var(--accent);background:var(--accentSoft);}
.opt .ltr{font-weight:700;color:var(--accent);min-width:20px;}
.opt.sel{background:var(--accentSoft);border-color:var(--accent);}
.opt.correct{background:var(--okBg);border-color:var(--okBd);}
.opt.correct .ltr{color:var(--okTx);}
.opt.wrong{background:var(--errBg);border-color:var(--errBd);}
.opt.wrong .ltr{color:var(--errTx);}
.opt.locked{cursor:default;}
.expl{margin-top:6px;padding:14px;border-radius:10px;background:var(--accentSoft);border:1px solid var(--border);font-size:14px;}
.expl .tag{font-weight:700;color:var(--accent);}
.nav{display:flex;gap:10px;margin-top:18px;}
.btn{flex:1;background:var(--chipBg);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font-size:15px;cursor:pointer;}
.btn:hover{border-color:var(--accent);}
.btn-pri{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.pbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;}
.pbtn.cur{outline:2px solid var(--accent);outline-offset:1px;}
.pbtn.done{background:var(--accentSoft);border-color:var(--accent);}
.pbtn.ok{background:var(--okBg);border-color:var(--okBd);color:var(--okTx);}
.pbtn.bad{background:var(--errBg);border-color:var(--errBd);color:var(--errTx);}
.palette-title{font-size:13px;color:var(--muted);margin-bottom:8px;}
.result{text-align:center;}
.result .big{font-size:52px;font-weight:800;}
.result .grade{font-size:20px;margin:8px 0 6px;}
.pass{color:var(--okTx);} .fail{color:var(--errTx);}
ul.rules{margin:8px 0;padding-inline-start:22px;}
ul.rules li{margin-bottom:4px;}
.link{color:var(--accent);font-size:14px;text-decoration:none;}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0 4px;}
.mode{border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;background:var(--surface);transition:.12s;text-align:center;}
.mode:hover{border-color:var(--accent);background:var(--accentSoft);}
.mode.active{border-color:var(--accent);background:var(--accentSoft);box-shadow:0 0 0 1px var(--accent) inset;}
.mode .mt{font-weight:700;font-size:16px;margin-bottom:2px;}
.mode .md{font-size:13px;color:var(--muted);}
.mix{font-size:13px;color:var(--muted);margin-top:10px;}
.mix b{color:var(--text);}
.rec{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;text-align:right;}
.rec.bad{background:var(--errBg);border-color:var(--errBd);}
.rec.mid{background:var(--midBg);border-color:var(--midBd);}
.rec.good{background:var(--okBg);border-color:var(--okBd);}
.rec.skip{opacity:.6;}
.rec .rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.rec .rt{font-weight:700;font-size:15px;}
.rec .rs{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);}
.rec .rn{margin-inline-start:auto;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
.rec .rbar{height:6px;background:var(--chipBg);border-radius:999px;overflow:hidden;margin:6px 0 8px;}
.rec .rbar>i{display:block;height:100%;border-radius:999px;}
.rec .rhint{font-size:13px;color:var(--muted);line-height:1.55;}
.rec .rlink{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;}
.rec .rlink:hover{text-decoration:underline;}
.verdict{font-size:15px;font-weight:600;margin-bottom:14px;padding:12px;border-radius:10px;background:var(--accentSoft);border:1px solid var(--border);}
@media(max-width:520px){.wrap{padding:16px;}.card{padding:18px;}.qtext{font-size:16px;}.pbtn{width:30px;height:30px;font-size:12px;}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>בוחן מדומה — אתיקה עסקית</h1>
  <div class="sub">ד"ר רון ברגר · קוד 865562901 · שאלות מוגרלות מחדש בכל בוחן לפי משקלות המיקוד · <a class="link" href="index.html">← מאגר התרגול</a></div>
</header>
<div id="root"></div>
</div>

<script src="questions.js"></script>
<script>
/* משקלות לפי מיקוד המרצה */
const SPEC=[
  {t:"מצגת 1 — מבוא ותיאוריות",           w:.48},
  {t:"מצגת 2 — תאגיד ומוסר",              w:.16},
  {t:"מצגת 3 — ציות ולמידה ארגונית",      w:.12},
  {t:"מצגת 4 — חוק, CSR וממשל",           w:.16},
  {t:"מצגת 5 — דת, תרבות והתפתחות מוסרית",w:.08},
];
const MODES=[
  {id:'fast', name:'⚡ מהיר',  n:10, secs:10*60,   d:'10 שאלות · 10 דקות'},
  {id:'mid',  name:'🎯 בינוני',n:15, secs:20*60,   d:'15 שאלות · 20 דקות'},
  {id:'full', name:'📝 מלא',   n:25, secs:120*60,  d:'25 שאלות · שעתיים'},
  {id:'free', name:'♾️ ללא זמן',n:25,secs:0,       d:'25 שאלות · בלי טיימר'},
];
/* מה לחזור עליו בכל נושא — לפי קובץ המיקוד */
const HINTS={
 "מצגת 1 — מבוא ותיאוריות":"4 המיתוסים · אתיקה כערכים בין-אישיים · חוק מול אתיקה (רף תחתון/עליון) · המבחן האתי · 7 התיאוריות: פרידמן והיד הנעלמה, בעלי עניין (פריימן), קאנט (5 עקרונות), מיל, אריסטו (3 סוגי צדק), זכויות, שיתוף ערכים",
 "מצגת 2 — תאגיד ומוסר":"מהו תאגיד והרמת מסך · בעיית הנציג · אחריות שילוחית / הארגון כאדם / כצירוף / אתוס · מהי דילמה · 8 ההתרצויות · כהנמן ודילמת האסיר",
 "מצגת 3 — ציות ולמידה ארגונית":"ציות ומעבר לציות · 5 שלבי הלמידה הארגונית (הגנתי ← ציות ← ניהולי ← אסטרטגי ← אזרחי) · פרשת נייק · צרכנות אכפתית",
 "מצגת 4 — חוק, CSR וממשל":"פירמידת קארול · דפוסי CSR (כלכלי/אתי/פילנתרופי/אסטרטגי) · ESG · ממשל תאגידי וקוד אתי · 4 המגזרים · גלוקליזציה · מגבלות החקיקה וכשל הריסון",
 "מצגת 5 — דת, תרבות והתפתחות מוסרית":"שלבי ההתפתחות המוסרית (קולברג) · רלטיביזם מוסרי · דת כתחליף מוסר · מודל הריסון-וויקס · צדק ארגוני",
};
const L=['א','ב','ג','ד','ה'];
let mode=MODES[2], phase='intro', idx=0, answers={}, remaining=0, timerId=null, review=false, EXAM=[];
const $=s=>document.querySelector(s);
const root=()=>document.getElementById('root');
const fmt=s=>{s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h>0?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`;};
const score=()=>EXAM.reduce((a,q,i)=>a+(answers[i]===q.c?1:0),0);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* הקצאת מכסות לפי משקל (שיטת השארית הגדולה) + התאמה לזמינות במאגר */
function quotas(n){
  const pools=SPEC.map(s=>({...s,pool:BANK.map((q,i)=>({q,i})).filter(x=>x.q.t===s.t)}));
  let alloc=pools.map(p=>{const raw=p.w*n;return {...p,base:Math.floor(raw),rem:raw-Math.floor(raw)};});
  let used=alloc.reduce((a,x)=>a+x.base,0);
  // מיון לפי שארית; בשוויון שאריות — הכרעה אקראית, כדי שנושאים במשקל זהה יתחלפו בין בוחנים
  alloc.forEach(a=>a.j=Math.random());
  alloc.sort((a,b)=>(b.rem-a.rem)||(a.j-b.j));
  for(let k=0;used<n;k=(k+1)%alloc.length){alloc[k].base++;used++;}
  alloc.forEach(a=>{a.base=Math.min(a.base,a.pool.length);});
  return alloc;
}

function buildExam(n){
  const alloc=quotas(n);
  let picked=[];
  alloc.forEach(a=>{picked.push(...shuffle(a.pool.slice()).slice(0,a.base));});
  // אם חסר (מאגר קטן בנושא) — משלימים אקראית משאר המאגר
  if(picked.length<n){
    const taken=new Set(picked.map(x=>x.i));
    const rest=shuffle(BANK.map((q,i)=>({q,i})).filter(x=>!taken.has(x.i)));
    picked.push(...rest.slice(0,n-picked.length));
  }
  shuffle(picked);
  // ערבוב סדר המסיחים בכל שאלה — כדי שלא נשנן "התשובה היא א'"
  return picked.map(({q})=>{
    const perm=shuffle([0,1,2,3,4]);
    return {t:q.t, q:q.q, o:perm.map(j=>q.o[j]), c:perm.indexOf(q.c), e:q.e};
  });
}

function render(){
  if(phase==='intro') return renderIntro();
  if(phase==='done')  return renderDone();
  renderExam();
}

function renderIntro(){
  const al=quotas(mode.n).slice().sort((a,b)=>SPEC.findIndex(s=>s.t===a.t)-SPEC.findIndex(s=>s.t===b.t));
  const mix=al.map(a=>`${a.t.split(' — ')[0]}: <b>${a.base}</b>`).join(' · ');
  root().innerHTML=`<div class="card">
    <div class="qtext">בחר מצב בוחן</div>
    <div class="modes" id="modes">${MODES.map(m=>`
      <div class="mode${m.id===mode.id?' active':''}" data-id="${m.id}">
        <div class="mt">${m.name}</div><div class="md">${m.d}</div>
      </div>`).join('')}</div>
    <div class="mix">הרכב מוגרל לפי המיקוד — ${mix}</div>
    <ul class="rules" style="margin-top:14px">
      <li><b>כל בוחן מגריל שאלות חדשות</b> מתוך ${BANK.length} שאלות המאגר</li>
      <li>גם <b>סדר המסיחים משתנה</b> בכל פעם — אי אפשר לשנן מיקום תשובה</li>
      <li>אין משוב במהלך הבוחן — התשובות וההסברים מופיעים <b>רק לאחר ההגשה</b></li>
      <li>ציון עובר: <b>60</b>${mode.secs?' · בסיום הזמן הבוחן מוגש אוטומטית':''}</li>
    </ul>
    <div class="nav"><button class="btn btn-pri" id="start">התחל בוחן ${mode.secs?'⏱️':'▶'}</button></div>
  </div>
  <div class="stats" style="justify-content:center"><a class="link" href="index.html">← למאגר התרגול (${BANK.length} שאלות עם משוב מיידי)</a></div>`;
  document.querySelectorAll('.mode').forEach(el=>el.onclick=()=>{mode=MODES.find(m=>m.id===el.dataset.id);render();});
  $('#start').onclick=start;
}

function start(){
  EXAM=buildExam(mode.n);
  phase='exam'; idx=0; answers={}; review=false; remaining=mode.secs;
  if(timerId){clearInterval(timerId);timerId=null;}
  if(mode.secs>0){
    timerId=setInterval(()=>{remaining--;
      const t=$('#timer'); if(t){t.textContent=fmt(remaining); if(remaining<=Math.min(300,mode.secs*.15))t.classList.add('low');}
      if(remaining<=0) submit();},1000);
  }
  render();
}

function renderExam(){
  const q=EXAM[idx], sel=answers[idx], N=EXAM.length;
  const opts=q.o.map((o,j)=>`<div class="opt${sel===j?' sel':''}" data-j="${j}"><span class="ltr">${L[j]}</span><span>${o}</span></div>`).join('');
  const answered=Object.keys(answers).length;
  root().innerHTML=`<div class="card">
    <div class="stats">
      <span>שאלה <b>${idx+1}</b>/${N}</span>
      <span>נענו: <b>${answered}</b>/${N}</span>
      <span style="flex:1"></span>
      ${mode.secs?`<span class="timer" id="timer">${fmt(remaining)}</span>`:`<span class="timer">♾️</span>`}
    </div>
    <div class="bar"><i style="width:${answered/N*100}%"></i></div>
    <div class="qmeta">${q.t}</div>
    <div class="qtext">${idx+1}. ${q.q}</div>
    <div>${opts}</div>
    <div class="nav">
      <button class="btn" id="prev" ${idx===0?'disabled':''}>◀ הקודמת</button>
      <button class="btn btn-pri" id="next">${idx===N-1?'סיום ▶':'הבאה ▶'}</button>
    </div>
  </div>
  <div class="card">
    <div class="palette-title">מפת שאלות</div>
    <div class="palette" id="pal"></div>
    <div class="nav"><button class="btn btn-pri" id="submit">הגש בוחן ✓</button></div>
  </div>`;
  document.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{answers[idx]=+el.dataset.j; render();});
  $('#prev').onclick=()=>{if(idx>0){idx--;render();}};
  $('#next').onclick=()=>{if(idx<N-1){idx++;render();}};
  $('#submit').onclick=()=>{const miss=N-Object.keys(answers).length;
    if(miss>0 && !confirm(`נותרו ${miss} שאלות ללא מענה. להגיש בכל זאת?`))return; submit();};
  const pal=$('#pal');
  EXAM.forEach((_,k)=>{const b=document.createElement('button');
    b.className='pbtn'+(k===idx?' cur':'')+(answers[k]!=null?' done':'');
    b.textContent=k+1; b.onclick=()=>{idx=k;render();}; pal.appendChild(b);});
}

function submit(){ if(timerId){clearInterval(timerId);timerId=null;} phase='done'; idx=0; review=false; render(); }

function renderDone(){
  const N=EXAM.length, corr=score(), pct=Math.round(corr/N*100), pass=pct>=60;
  if(!review){
    const grade=pct>=90?'מצוין! 🏆':pct>=80?'טוב מאוד 👏':pct>=70?'טוב 👍':pct>=60?'עובר ✓':'לא עובר — דרוש חזרה 📚';
    // פילוח לפי נושא (לפי סדר המצגות)
    const stat=SPEC.map(s=>{
      const qs=EXAM.map((q,i)=>({q,i})).filter(x=>x.q.t===s.t);
      const c=qs.filter(x=>answers[x.i]===x.q.c).length;
      return {t:s.t, short:s.t.split(' — ')[0], n:qs.length, c,
              p:qs.length?Math.round(c/qs.length*100):null,
              miss:qs.filter(x=>answers[x.i]!==x.q.c).map(x=>x.i+1)};
    });
    const tested=stat.filter(s=>s.n>0);
    const weak=tested.filter(s=>s.p<60).sort((a,b)=>a.p-b.p);
    const mid =tested.filter(s=>s.p>=60&&s.p<80).sort((a,b)=>a.p-b.p);
    // מסקנה כללית
    let verdict;
    if(!weak.length&&!mid.length&&pct>=90) verdict=`🏆 <b>שליטה מצוינת בכל הנושאים שנבדקו.</b> המשך לתרגל בוחנים חדשים כדי לכסות שאלות שטרם ראית.`;
    else if(weak.length) verdict=`📌 <b>מומלץ להתמקד ב: ${weak.map(s=>s.short).join(', ')}</b>${mid.length?` — ולאחר מכן לחזור על ${mid.map(s=>s.short).join(', ')}.`:'.'}`;
    else if(mid.length) verdict=`📌 <b>כמעט שם.</b> כדאי לחזור על: <b>${mid.map(s=>s.short).join(', ')}</b>.`;
    else verdict=`✓ <b>ביצועים טובים בכל הנושאים שנבדקו.</b>`;
    // כרטיס לכל נושא — החלשים ראשונים
    const rank=s=>s.n===0?3:(s.p<60?0:s.p<80?1:2);
    const rows=stat.slice().sort((a,b)=>rank(a)-rank(b)||(a.p??101)-(b.p??101)).map(s=>{
      if(!s.n) return `<div class="rec skip"><div class="rh"><span class="rt">${s.short}</span>
        <span class="rs">לא נבדק בבוחן זה</span></div>
        <div class="rhint">הגרל בוחן נוסף כדי להיבחן גם על נושא זה.</div>
        <a class="rlink" href="index.html?topic=${encodeURIComponent(s.t)}">תרגל נושא זה ←</a></div>`;
      const cls=s.p<60?'bad':s.p<80?'mid':'good';
      const badge=s.p<60?'🔴 חיזוק נדרש':s.p<80?'🟡 כדאי לחזור':'🟢 שליטה טובה';
      const col=s.p<60?'var(--errTx)':s.p<80?'#c9962a':'var(--okTx)';
      return `<div class="rec ${cls}">
        <div class="rh"><span class="rt">${s.short}</span><span class="rs">${badge}</span>
          <span class="rn">${s.c}/${s.n} · ${s.p}%</span></div>
        <div class="rbar"><i style="width:${s.p}%;background:${col}"></i></div>
        ${s.p<80?`<div class="rhint"><b>לחזור על:</b> ${HINTS[s.t]||''}</div>`:''}
        ${s.miss.length?`<div class="rhint" style="margin-top:6px">שגית בשאלות: ${s.miss.join(', ')} — ראה בסקירה המלאה.</div>`:''}
        <a class="rlink" href="index.html?topic=${encodeURIComponent(s.t)}">תרגל נושא זה ←</a>
      </div>`;
    }).join('');
    root().innerHTML=`<div class="card result">
      <div class="big ${pass?'pass':'fail'}">${pct}</div>
      <div class="grade ${pass?'pass':'fail'}">${corr} מתוך ${N} נכונות · ${grade}</div>
      ${mode.secs?`<div style="color:var(--muted);font-size:14px;margin-bottom:16px">זמן שנותר: ${fmt(remaining)}</div>`:''}
      <div class="nav">
        <button class="btn btn-pri" id="rev">סקירה מלאה 🔍</button>
        <button class="btn" id="again">בוחן חדש ↻</button>
      </div>
      <div class="nav"><button class="btn" id="back">שנה מצב בוחן</button></div>
    </div>
    <div class="card">
      <div class="qtext" style="margin-bottom:10px">📊 ניתוח והמלצות לחיזוק</div>
      <div class="verdict">${verdict}</div>
      ${rows}
    </div>`;
    $('#rev').onclick=()=>{review=true;idx=0;render();};
    $('#again').onclick=start;
    $('#back').onclick=()=>{phase='intro';render();};
    return;
  }
  const q=EXAM[idx], sel=answers[idx];
  const opts=q.o.map((o,j)=>{let c='opt locked';if(j===q.c)c+=' correct';else if(j===sel)c+=' wrong';
    return `<div class="${c}"><span class="ltr">${L[j]}</span><span>${o}</span></div>`;}).join('');
  const tag=sel===q.c?'✔ נכון':(sel==null?'— לא נענתה · התשובה: '+L[q.c]:'✘ שגוי · התשובה: '+L[q.c]);
  root().innerHTML=`<div class="card">
    <div class="stats"><span>סקירה — שאלה <b>${idx+1}</b>/${N}</span><span style="flex:1"></span><span>ציון: <b>${pct}</b></span></div>
    <div class="qmeta">${q.t}</div>
    <div class="qtext">${idx+1}. ${q.q}</div>
    ${opts}
    <div class="expl"><span class="tag">${tag}</span> — ${q.e}</div>
    <div class="nav">
      <button class="btn" id="prev" ${idx===0?'disabled':''}>◀ הקודמת</button>
      <button class="btn" id="next" ${idx===N-1?'disabled':''}>הבאה ▶</button>
    </div>
  </div>
  <div class="card"><div class="palette-title">מפת שאלות</div><div class="palette" id="pal"></div>
    <div class="nav"><button class="btn btn-pri" id="again">בוחן חדש ↻</button></div></div>`;
  $('#prev').onclick=()=>{if(idx>0){idx--;render();}};
  $('#next').onclick=()=>{if(idx<N-1){idx++;render();}};
  $('#again').onclick=start;
  const pal=$('#pal');
  EXAM.forEach((_,k)=>{const b=document.createElement('button');
    b.className='pbtn'+(k===idx?' cur':'')+(answers[k]===EXAM[k].c?' ok':' bad');
    b.textContent=k+1; b.onclick=()=>{idx=k;render();}; pal.appendChild(b);});
}

render();
</script>
</body>
</html>
