<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בוחן תרגול — אתיקה עסקית</title>
<style>
:root{
  --bg:#f7f6f3; --surface:#ffffff; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --accent:#185fa5; --accentSoft:#e8f0f8;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --chipBg:#efeee9;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1a1a18; --surface:#242421; --text:#ececea; --muted:#a3a39c;
    --border:#37372f; --accent:#5b9bd5; --accentSoft:#22344a;
    --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
    --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
    --chipBg:#2f2f2a;
  }
}
html.dark{
  --bg:#1a1a18; --surface:#242421; --text:#ececea; --muted:#a3a39c;
  --border:#37372f; --accent:#5b9bd5; --accentSoft:#22344a;
  --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
  --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
  --chipBg:#2f2f2a;
}
html.light{
  --bg:#f7f6f3; --surface:#ffffff; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --accent:#185fa5; --accentSoft:#e8f0f8;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --chipBg:#efeee9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',Arial,'Helvetica Neue',sans-serif;line-height:1.6;}
.wrap{max-width:780px;margin:0 auto;padding:24px;}
header h1{font-size:24px;margin:0 0 4px;}
header .sub{color:var(--muted);font-size:14px;margin-bottom:16px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
.chip{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;transition:.15s;}
.chip:hover{border-color:var(--accent);}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.spacer{flex:1;}
.iconbtn{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin-bottom:14px;color:var(--muted);}
.stats b{color:var(--text);}
.bar{height:8px;background:var(--chipBg);border-radius:999px;overflow:hidden;margin-bottom:18px;}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
.qmeta{font-size:12px;color:var(--muted);margin-bottom:6px;}
.qtext{font-size:18px;font-weight:600;margin-bottom:16px;}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:.12s;background:var(--surface);}
.opt:hover{border-color:var(--accent);background:var(--accentSoft);}
.opt .ltr{font-weight:700;color:var(--accent);min-width:20px;}
.opt.correct{background:var(--okBg);border-color:var(--okBd);}
.opt.correct .ltr{color:var(--okTx);}
.opt.wrong{background:var(--errBg);border-color:var(--errBd);}
.opt.wrong .ltr{color:var(--errTx);}
.opt.locked{cursor:default;}
.opt.locked:hover{background:var(--surface);}
.opt.correct.locked:hover{background:var(--okBg);}
.opt.wrong.locked:hover{background:var(--errBg);}
.expl{margin-top:6px;padding:14px;border-radius:10px;background:var(--accentSoft);
  border:1px solid var(--border);font-size:14px;display:none;}
.expl.show{display:block;}
.expl .tag{font-weight:700;color:var(--accent);}
.nav{display:flex;gap:10px;margin-top:18px;}
.btn{flex:1;background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:12px;font-size:15px;cursor:pointer;}
.btn:hover{border-color:var(--accent);}
.btn-pri{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.pbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;}
.pbtn.cur{outline:2px solid var(--accent);outline-offset:1px;}
.pbtn.ok{background:var(--okBg);border-color:var(--okBd);color:var(--okTx);}
.pbtn.bad{background:var(--errBg);border-color:var(--errBd);color:var(--errTx);}
.palette-title{font-size:13px;color:var(--muted);margin-bottom:8px;}
.result{text-align:center;}
.result .big{font-size:46px;font-weight:800;color:var(--accent);}
.result .grade{font-size:18px;margin:8px 0 16px;}
@media (max-width:520px){
  .wrap{padding:16px;} .card{padding:18px;} .qtext{font-size:16px;}
  .pbtn{width:30px;height:30px;font-size:12px;}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>בוחן תרגול — אתיקה עסקית</h1>
  <div class="sub">ד"ר רון ברגר · קוד 865562901 · 50 שאלות רשמיות (מצגות 1–5) + 47 שאלות נוספות לפי קובץ המיקוד · חומר סגור</div>
</header>

<div class="card">
  <div class="toolbar" id="filters"></div>
  <div class="toolbar" id="srcfilters"></div>
  <div class="stats">
    <span>שאלה <b id="sIdx">1</b> / <b id="sTot">50</b></span>

  <div class="palette" id="palette"></div>
</div>

<div class="toolbar">
  <button class="iconbtn" id="theme">🌓 מצב כהה/בהיר</button>
  <button class="iconbtn" id="shuffle">🔀 ערבב שאלות</button>
  <button class="iconbtn" id="reset">↻ אתחל בוחן</button>
  <span class="spacer"></span>
  <button class="iconbtn btn-pri" id="finish" style="color:#fff">סיים והצג ציון</button>
</div>

</div>

<script>
const BANK = [
/* ===== מצגת 1 ===== */
{t:"מצגת 1 — מבוא ותיאוריות", q:`תורת המידות דנה בסוגיות הקשורות:`,
o:[`לסטנדרט חוקי של עשיית עסקים`,`לרף התחתון של הדברים הראויים לעשותם או לא לעשותם`,`למהו חוקי ומהו לא חוקי במדינה מסוימת`,`לרף העליון של הדברים הראויים לעשותם או לא לעשותם`,`לחוקי מדינה`],c:3,
e:`האתיקה (ובכללה תורת המידות) עוסקת ברף העליון — מה ראוי לעשות; החוק מציב את הרף התחתון.`},

{t:"מצגת 1 — מבוא ותיאוריות", q:`מה מהבאים אינו כלול במבחן האתי?`,
o:[`האם זה מוביל ליתרון תחרותי`,`האם זה יגרום לי להרגיש טוב`,`האם זה מאוזן`,`האם זה חוקי`,`האם זה פוגע במדיניות הארגון`],c:0,
e:`המבחן האתי בודק חוקיות, מדיניות, איזון, win-win ותחושה אישית — לא יתרון תחרותי.`},

{t:"מצגת 1 — מבוא ותיאוריות", q:`איזו מהאפשרויות מתארת בצורה הטובה ביותר את הקשר בין חוק ואתיקה במסגרת משאבי אנוש?`,
o:[`האתיקה ניתנת לאכיפה ע"י סוכנויות ממשלתיות, בעוד חוקים הם הצעות לשיטות עבודה מומלצות`,`האתיקה והמשפט עצמאיים לחלוטין; לפעולות משפטיות אין קשר לשיקולים אתיים`,`החוק מכתיב אתיקה, ולכן כל פעולה חוקית נחשבת גם אתית`,`החוק הוא שיקוף של הסטנדרטים האתיים המינימליים שעליהם מסכימה החברה, אך שיקולים אתיים חורגים לרוב מעבר לדרישות החוק`,`משפט הוא תת-קבוצה של אתיקה — כל פעולה משפטית היא בהכרח אתית`],c:3,
e:`החוק = מינימום אתי מוסכם; האתיקה חורגת מעבר אליו.`},

{t:"מצגת 1 — מבוא ותיאוריות", q:`עפ"י איזו תיאוריה הצדיקו האמריקאים את השימוש בפצצת האטום כנגד יפן?`,
o:[`התיאוריה הקנטיאנית / הדאונטולוגית`,`תיאוריית המידות הטובות`,`תיאוריה של זכויות`,`אין דבר שיכול להצדיק מעשה שבו כה הרבה אנשים נפגעים`,`התיאוריה התועלתנית`],c:4,
e:`תועלתנות (מיל): התוצאה קובעת — מניעת מאות אלפי הרוגים נוספים מצדיקה את הפעולה.`},

{t:"מצגת 1 — מבוא ותיאוריות", q:`איזו דילמה אתית עשויה לנבוע מהעיקרון הקפיטליסטי של מקסום רווחים ביחס לקיימות סביבתית?`,
o:[`קיימות סביבתית אינה מושפעת ממערכות כלכליות כמו קפיטליזם`,`אין דילמה — השווקים מווסתים את עצמם מבלי לפגוע בסביבה`,`מקסום רווחים מתיישר עם קיימות שכן עסקים שואפים להפחית בזבוז`,`מערכות קפיטליסטיות מצוידות טוב יותר להתמודד עם בעיות סביבתיות`,`מקסום רווחים עשוי להוביל עסקים להתעלם או לערער את הדאגות הסביבתיות לטובת רווחים פיננסיים בטווח הקצר`],c:4,
e:`מתח קלאסי בין רווח קצר-טווח לבין השפעות חיצוניות (זיהום) שאינן מתומחרות.`},

{t:"מצגת 1 — מבוא ותיאוריות", q:`איזה אתגר אתי יכול לנבוע ממערכות שכר מבוססות-ביצועים ב-HRM תחת הקפיטליזם?`,
o:[`הם עלולים להרתיע עבודת צוות אם אנשים מתמקדים אך ורק ביעדים שלהם`,`כל התשובות נכונות`,`הם מרתיעים ביצועים אינדיבידואליים`,`הם מפחיתים את רווחיות החברה`,`הם קלים יותר לניהול ממערכות שכר אחרות`],c:0,
e:`תגמול אישי עלול לפגוע בשיתוף הפעולה ובעבודת הצוות.`},

{t:"מצגת 1 — מבוא ותיאוריות", q:`התיאוריה התועלתנית טוענת ש:`,
o:[`יש לחפש את נקודת האמצע`,`לכל אחד יש זכויות בסיסיות בהיותו אדם`,`מבחן הכוונה / מניע הוא החשוב ביותר`,`יש למקסם את עושרם של בעלי עניין`,`יש לשאוף למיקסום עושר של כמה שיותר אנשים`],c:4,
e:`תועלתנות (מיל): מקסום התועלת/אושר לכמה שיותר אנשים. (א'=אריסטו, ג'=קאנט.)`},

{t:"מצגת 1 — מבוא ותיאוריות", q:`כיצד עשוי העיקרון של "יחס הוגן" בתחום משאבי אנוש להיפגע בסביבה קפיטליסטית תחרותית?`,
o:[`על ידי מתן עדיפות לרווחיות ויעילות על פני יחס שוויוני לעובדים`,`על ידי התמקדות רבה מדי ברווחת העובדים`,`על ידי מתן הטבות מופרזות לכל העובדים`,`על ידי קידום יתר של שיתוף פעולה בין מתחרים`,`על ידי אכיפת תקנות רבות מדי על הפעילות העסקית`],c:0,
e:`לחץ תחרותי דוחף להעדפת רווח ויעילות על פני הוגנות כלפי העובדים.`},

{t:"מצגת 1 — מבוא ותיאוריות", q:`מהו האתגר האתי העיקרי בפני אנשי משאבי אנוש כאשר החוקים מעורפלים או שותקים בנושא מסוים?`,
o:[`לפעול לטובת האינטרס הכלכלי של החברה ללא קשר לשיקולים אתיים`,`להתעלם מחוקים מעורפלים ולהתמקד בהנחיות משפטיות ברורות בלבד`,`לנווט בתחום האפור על ידי איזון בין ציות משפטי לבין חשיבה אתית וערכים ארגוניים`,`להסתמך אך ורק על שיפוטים מוסריים אישיים`,`אין אתגר — החוק מספק את כל ההנחיות הדרושות`],c:2,
e:`כשהחוק שותק, נדרש איזון בין ציות לבין שיקול אתי וערכי הארגון.`},

{t:"מצגת 1 — מבוא ותיאוריות", q:`עפ"י בעיית הקרונית (Philippa Foot, 1967), איזה פתרון מתאים לתיאוריית התועלתנות?`,
o:[`ניסיון לפתור את הדילמה (הכוונה) זה מה שחשוב`,`אין תיאוריה שמתאימה לקחת חיים של אדם`,`הסטת הקרון כך שייפגע עובד רכבת אחד ולא חמישה`,`הסטת הקרון כך שייפגעו חמישה עובדים ולא אזרח תמים אחד`,`במצב דילמה זה לא לעשות דבר הוא הפתרון הטוב ביותר`],c:2,
e:`תועלתנות = מזעור הנזק: הקרבת אחד כדי להציל חמישה.`},

/* ===== מצגת 2 ===== */
{t:"מצגת 2 — תאגיד ומוסר", q:`למה מתייחס "תיוג בלשון נקייה" (Euphemistic Labeling) בהקשר של אחריות מוסרית בארגון?`,
o:[`תהליך יצירת תוויות מותג למוצרים`,`תהליך של מזעור הנזק שאנו גורמים יחסית לאחרים`,`התייחסות ישירה להתנהגות לא אתית בארגון`,`הסוואת הנאמר במילים לא ברורות או שונות כדי לגרום להן להיראות מקובלות`,`שיטת הקצאת תפקידים בארגון`],c:3,
e:`ריכוך השפה כדי לטשטש את חומרת המעשה (למשל "התייעלות" במקום "פיטורים").`},

{t:"מצגת 2 — תאגיד ומוסר", q:`בעיית הנציג והמיוצג (Principal–Agent Dilemma) מתייחסת ל:`,
o:[`מצב שבו הנציג מיישם החלטות לא הגיוניות (logically inconsistent)`,`מצב שבו הנציג מטיל על התאגיד אחריות למעשי עובדיו`,`מצב שבו אחד מטפל בעניינו של האחר ועליו לפעול לטובתו`,`מצב שבו יש לבנות קונצנזוס המבוסס על יסודות מוסכמים בין הנציגים`,`מענה לקושי שבפיזור מרכיבי האחריות התאגידית בין אנשים שונים`],c:2,
e:`הנציג (המנהל) מחזיק חובת נאמנות לפעול לטובת המיוצג (הבעלים) — ועלול לנצלהּ לטובתו.`},

{t:"מצגת 2 — תאגיד ומוסר", q:`דילמה היא מצב ש:`,
o:[`לארגון ולפרט יש אחריות ומוטיבציה ישירה`,`יש מוטיבציה גבוהה לפתור את הבעיה אך אין הכרעה בשיפוט המוסרי`,`יש מוטיבציה גבוהה לפתור את הבעיה ויש הכרעה בשיפוט המוסרי`,`יש מוטיבציה נמוכה לפתור את הבעיה ויש הכרעה בשיפוט המוסרי`,`יש מוטיבציה נמוכה לפתור את הבעיה ואין הכרעה בשיפוט המוסרי`],c:1,
e:`דילמה = רוצים לפתור (מוטיבציה גבוהה) אבל אין הכרעה מוסרית ברורה בין החלופות.`},

{t:"מצגת 2 — תאגיד ומוסר", q:`התרצה (רציונליזציה) מספקת:`,
o:[`הנמקה מוסרית קונבנציונלית`,`הצדקה מתקבלת על הדעת להתנהגות`,`הנמקה מוסרית בתר-קונבנציונלית`,`הנמקה מוסרית ניהיליסטית`,`הנמקה מוסרית טרום-קונבנציונלית`],c:1,
e:`התרצה = מתן הצדקה שנשמעת סבירה למעשה לא-אתי.`},

{t:"מצגת 2 — תאגיד ומוסר", q:`אחריות שילוחית היא מצב ש:`,
o:[`לארגון אחריות ישירה ולפרט אחריות עקיפה`,`לארגון אחריות עקיפה ולפרט אחריות ישירה`,`לארגון ולפרט אחריות ישירה`,`לארגון ולפרט אחריות עקיפה`,`הוא דוגמה טובה לדילמת האסיר`],c:1,
e:`אחריות שילוחית: הפרט אחראי ישירות למעשהו, והארגון נושא באחריות עקיפה.`},

{t:"מצגת 2 — תאגיד ומוסר", q:`מצב שבו נעשתה עבירה אתית עקב בעיה באקלים המוסרי של הארגון נקרא בעיה ב:`,
o:[`אחריות הארגון כאדם`,`אחריות אתוס הארגון`,`אחריות מוסרית`,`אחריות שילוחית`,`אחריות כצירוף`],c:1,
e:`אתוס הארגון = האקלים והערכים שמכתיבים את ההתנהגות בארגון.`},

{t:"מצגת 2 — תאגיד ומוסר", q:`איזה מהבאים מתאר בצורה הטובה ביותר את המושג "הארגון כאדם" במונחי אחריות מוסרית?`,
o:[`ארגונים אחראים רק לעניינים משפטיים, לא מוסריים`,`רפיון מוסרי של הארגון כלפי עובדיו וסביבתו`,`לארגונים אין יכולת לקבל החלטות ללא תלות בחבריהם`,`ניתן להתייחס לארגונים כאל סוכנים מוסריים כי יש להם כוונות והם יכולים לקבל החלטות`,`ארגונים הם אוספים של אנשים, כל אחד עם אחריות מוסרית נפרדת`],c:3,
e:`"הארגון כאדם" = ישות בעלת כוונות ויכולת החלטה, ולכן סוכן מוסרי בפני עצמו.`},

{t:"מצגת 2 — תאגיד ומוסר", q:`כיצד אתוס הארגון משפיע על גישתו לדילמות אתיות?`,
o:[`מכתיב לארגון ללכת בדרך הרווחית ביותר ללא קשר לאתיקה`,`אין לזה השפעה כי לארגונים אין אתוס`,`מקטין רפיון מוסרי כחלק מגישת בעלי/מחזיקי העניין`,`מנחה תהליכי קבלת החלטות המבוססים על ערכים ועקרונות מוסריים מבוססים בארגון`,`משפיע רק על אסטרטגיות שיווק`],c:3,
e:`אתוס מבוסס מנתב את קבלת ההחלטות לפי ערכים מוסריים.`},

{t:"מצגת 2 — תאגיד ומוסר", q:`מה מרמזת "התעלמות או עיוות הפגיעה" (Disregarding or Distorting the Harm) מבחינת אתיקה ארגונית?`,
o:[`הגברת האחריות האישית`,`התייחסות ישירה להתנהגות לא אתית בארגון`,`הסוואת הנאמר במילים לא ברורות`,`הגזמת היתרונות של מוצרי הארגון`,`צמצום או הכחשת ההשפעה השלילית של פעולות הארגון`],c:4,
e:`מנגנון התרצה: ממעיטים בנזק שנגרם או מכחישים אותו.`},

{t:"מצגת 2 — תאגיד ומוסר", q:`כיצד תורם המושג "הארגון כצירוף" להבנת האחריות המוסרית הארגונית?`,
o:[`על ידי הדגשת הרפיון המוסרי של הארגון`,`על ידי התייחסות לארגון כאל ישות נפרדת מהפרט`,`על ידי הדגשת אחריות משפטית של הארגון`,`על ידי הכחשת כל אחריות מוסרית של הארגון כי הוא כלי בלבד`,`על ידי פתרון דילמות של מידת אחריות הארגון מול העובד`],c:1,
e:`"הארגון כצירוף" = ישות נפרדת מהפרטים המרכיבים אותה.`},

/* ===== מצגת 3 ===== */
{t:"מצגת 3 — ציות ולמידה ארגונית", q:`עפ"י מודל חמשת השלבים של למידה ארגונית, איזה משפט מתאר בצורה הטובה ביותר את השלב השלישי — "השלב הניהולי"?`,
o:[`זה נותן לנו יתרון תחרותי`,`אנחנו נעשה בדיוק כמה שאנחנו צריכים`,`אנחנו צריכים לוודא שכולם יעשו את זה`,`זה העסק, טיפש`,`אנחנו מבטיחים שלא נעשה את מה שהסכמנו לא לעשות`],c:3,
e:`לפי מפתח הקורס — תשובה ד'. (חמשת השלבים: הגנתי ← ציות ← ניהולי ← אסטרטגי ← אזרחי.)`},

{t:"מצגת 3 — ציות ולמידה ארגונית", q:`מהו מאפיין מפתח של חברות בשלב האסטרטגי בנוגע לגישתן כלפי אחריות חברתית?`,
o:[`עוסקות באחריות חברתית רק כשנדרש ע"י בעלי עניין`,`מתמקדות בעיקר בעמידה בתקנות קיימות`,`נותנות עדיפות ליוזמות אחריות חברתית לטווח קצר להשפעה מיידית`,`משלבות אחריות חברתית באסטרטגיה ובשיטות הליבה העסקיות שלהן`,`רואות אחריות חברתית כפונקציה נפרדת מהעסקים`],c:3,
e:`בשלב האסטרטגי האחריות החברתית הופכת לחלק מליבת האסטרטגיה העסקית.`},

{t:"מצגת 3 — ציות ולמידה ארגונית", q:`במהלך שלב הציות, מהי המטרה העיקרית של החברה?`,
o:[`לשלול קישורים לתוצאות שליליות`,`לתת למנהלים אחריות לפתרונות`,`לבסס ולקיים מדיניות ארגונית`,`לעקוף בעיות באמצעות יחסי ציבור`,`לפתח מוצרים בטוחים יותר לסביבה`],c:2,
e:`שלב הציות = ביסוס וקיום מדיניות ארגונית העומדת בדרישות.`},

{t:"מצגת 3 — ציות ולמידה ארגונית", q:`ראיית המוסר כעלות מתאימה לאיזה שלב בלמידה ארגונית?`,
o:[`ציות`,`אזרחי`,`אסטרטגי`,`ניהולי`,`הגנה`],c:0,
e:`בשלב הציות המוסר נתפס כעלות/נטל שיש לעמוד בו, לא כיתרון.`},

{t:"מצגת 3 — ציות ולמידה ארגונית", q:`באיזה שלב חברות מבינות שעמידה בתקני עבודה מחייבת שינויים בתמריצי רכש, תחזיות מכירות וניהול מלאי?`,
o:[`אין תשובה נכונה`,`השלב האסטרטגי`,`השלב הניהולי`,`שלב הציות`,`השלב ההגנתי`],c:2,
e:`בשלב הניהולי האחריות מוטמעת בתהליכי הניהול השוטפים (רכש, מכירות, מלאי).`},

{t:"מצגת 3 — ציות ולמידה ארגונית", q:`מה ההבדל העיקרי ביעד בין שלב הציות לשלב האסטרטגי בנוגע למוניטין החברה?`,
o:[`שלב הציות מגן על המוניטין ע"י הפחתת סיכוני ליטיגציה, ואילו השלב האסטרטגי משתמש בשיטות עסקיות אחראיות כדי לשפר את המוניטין ולתרום להצלחה ארוכת-טווח`,`שני השלבים מתמקדים בטקטיקות משפטיות אגרסיביות`,`שני השלבים מתעלמים מניהול מוניטין לטובת ביצועים פיננסיים`,`שלב הציות מגן על המוניטין, ואילו האסטרטגי מנצל אותו לרווחים בטווח הקצר`,`שלב הציות מתעלם מהמוניטין ומתמקד בהתרחבות`],c:0,
e:`ציות = הגנה מסיכון; אסטרטגי = שימוש פרואקטיבי באחריות לבניית מוניטין ארוך-טווח.`},

{t:"מצגת 3 — ציות ולמידה ארגונית", q:`כיצד נבדלים שלבי הציות וההגנה בגישתם לסוגיות משפטיות?`,
o:[`שניהם ממזערים מעורבות משפטית ע"י הסדרה מחוץ לבית המשפט`,`ציות מתמקד בהרחבת שוק, וההגנתי מדגיש הימנעות משפטית`,`שניהם מתעלמים מסטנדרטים משפטיים לטובת טקטיקות שוק אגרסיביות`,`שלב הציות מתמקד בעמידה בסטנדרטים משפטיים, ואילו שלב ההגנה עוסק באופן פעיל במאבקים משפטיים כדי להגן על החברה`,`שניהם נותנים עדיפות לפיתוח מדיניות פנימית על פני דאגות משפטיות`],c:3,
e:`ציות = עמידה בחוק; הגנתי = התגוננות אקטיבית מפני תביעות והאשמות.`},

{t:"מצגת 3 — ציות ולמידה ארגונית", q:`הדיון סביב "יהלומי דם" הוא דוגמה טובה ל:`,
o:[`העדפת מוצרים שמטיבים עם אוכלוסייה מסוימת`,`החרמת מוצרים שפוגעת באיכות הסביבה`,`החרמת מוצרים בשלב השיווק`,`החרמת מוצרים בשלב הייצור`,`החרמת מוצרים בשלב השימור`],c:3,
e:`"יהלומי דם" — בעיה בשלב הייצור (כרייה בתנאי ניצול/מימון מלחמות).`},

{t:"מצגת 3 — ציות ולמידה ארגונית", q:`עפ"י מודל חמשת השלבים של למידה ארגונית, איזה משפט מתאר בצורה הטובה ביותר את השלב הראשון — "מצב הגנתי"?`,
o:[`זה לא התפקיד שלנו לתקן את זה`,`זה נותן לנו יתרון תחרותי`,`אנחנו מבטיחים שלא נעשה את מה שהסכמנו לא לעשות`,`אנחנו נעשה בדיוק כמה שאנחנו צריכים`,`זה העסק, טיפש`],c:0,
e:`שלב הגנתי = הכחשת האחריות: "זו לא אחריותנו".`},

{t:"מצגת 3 — ציות ולמידה ארגונית", q:`הגישה הכלכלית של "היד הנעלמה" מתאימה לאיזה שלב של למידה ארגונית?`,
o:[`הגנה`,`ניהולי`,`אסטרטגי`,`ציות`,`אזרחי`],c:2,
e:`לפי מפתח הקורס — השלב האסטרטגי.`},

/* ===== מצגת 4 ===== */
{t:"מצגת 4 — חוק, CSR וממשל", q:`"כשל הריסון" כחלק ממגבלות החקיקה מתייחס ל:`,
o:[`חוק לא חד-משמעי שאין מענישים לפיו כשהוא ניתן לפירושים סותרים`,`רוב החקיקה בתחום אינה יותר מאשר מתן גושפנקא לדרכים המקובלות של ניהול עסקים`,`חוק שצריך לענות על צורכי השעה ולכן מגיב לשינויי המציאות`,`מצב שבו תחנות הצדק טוחנות לאט`,`הנחה שכוח האכיפה פועל בעצם קיומו ואיומו יותר מאשר בהוצאתו לפועל`],c:1,
e:`כשל הריסון: החקיקה בעיקר מעניקה גושפנקא לנהוג מקובל — אינה יוצרת סטנדרטים חדשים.`},

{t:"מצגת 4 — חוק, CSR וממשל", q:`מי מבעלי העניין הבאים מושפע ישירות מהקוד האתי של חברה?`,
o:[`ספקים`,`לקוחות`,`רגולטורים ממשלתיים`,`כל האמור לעיל`,`מתחרים`],c:3,
e:`הקוד האתי משפיע על מגוון בעלי העניין — ספקים, לקוחות ורגולטורים כאחד.`},

{t:"מצגת 4 — חוק, CSR וממשל", q:`איזו מהדוגמאות הבאות חוקית אך לא מוסרית?`,
o:[`אין תשובה נכונה`,`גניבת מידע ממתחרים`,`דרישה מעובדים לעבוד בחג נגד רצונם`,`העלמת מס`,`הכשלת מתחרים`],c:4,
e:`הכשלת מתחרים יכולה להיות חוקית (במגבלות) אך אינה אתית. (גניבה והעלמת מס — לא חוקיות.)`},

{t:"מצגת 4 — חוק, CSR וממשל", q:`"היד הנעלמה" של אדם סמית (1776) היא:`,
o:[`כלי לקביעת הגבולות בין הפרט לחברה`,`המציאות הכלכלית כי ניתן לסמוך על ארגונים לעשות את הדבר הנכון`,`מנגנון כלכלי שאמור לווסת את מערכת המשפט`,`גישה סוציאליסטית לעסקים`,`מנגנון חברתי האמור לווסת את הפעילות הכלכלית`],c:4,
e:`היד הנעלמה = מנגנון השוק שמווסת פעילות כלכלית ללא כפייה.`},

{t:"מצגת 4 — חוק, CSR וממשל", q:`תוצאות הסרט "לאכול בגדול" על תעשיית המזון המהיר הן דוגמה טובה ל:`,
o:[`שלב אזרחי`,`שלב אסטרטגי`,`שלב הגנתי`,`שלב ציות`,`שלב ניהולי`],c:0,
e:`לחץ ציבורי/צרכני שמוביל לשינוי — מאפיין את השלב האזרחי.`},

{t:"מצגת 4 — חוק, CSR וממשל", q:`מה מהבאים אינו הנחת יסוד של תיאוריית "היד הנעלמה"?`,
o:[`הדדיות`,`חופש`,`מספר מועט של קונים ומוכרים (סוג של אוליגופול)`,`צדק`,`זכויות קניין`],c:2,
e:`שוק חופשי מניח ריבוי קונים ומוכרים — לא מספר מועט (אוליגופול הוא כשל שוק).`},

{t:"מצגת 4 — חוק, CSR וממשל", q:`לפי פירמידת האחריות של קארול, איזו מהבאות אינה אחת מרמות האחריות החברתית של תאגיד?`,
o:[`אחריות אתית`,`אחריות סביבתית`,`אחריות משפטית`,`אחריות פילנתרופית`,`אחריות כלכלית`],c:1,
e:`רמות הפירמידה: כלכלית, משפטית, אתית, פילנתרופית. "סביבתית" אינה חלק מהמודל.`},

{t:"מצגת 4 — חוק, CSR וממשל", q:`"נאמנות" (Fiduciary) כחלק מהארגון כתחליף מוסר היא:`,
o:[`מצב של העדפת האינטרס הארגוני הלא-אישי על פני האינטרס העצמי`,`החובה לקדם עובדים עפ"י כללים ברורים`,`חלוקת סמכויות לקביעת אחריות אישית וחובת דין וחשבון`,`מבוססת על מחויבות הדדית`,`חלק מתיאוריית "היד הנעלמה" של אדם סמית`],c:0,
e:`חובת נאמנות = העמדת טובת הארגון/המיוצג לפני האינטרס האישי.`},

{t:"מצגת 4 — חוק, CSR וממשל", q:`הארגון כתחליף מוסר:`,
o:[`נכשל כי הארגון אחראי רק בצורה עקיפה למעשיו`,`נקרא "היד הגלויה"`,`טוען שלא ניתן לסמוך על ארגונים לעשות את הדבר הנכון`,`נקרא "היד הנעלמה"`,`נכשל כי לא הכול קניין פרטי`],c:1,
e:`הארגון כתחליף מוסר = "היד הגלויה" (פריימן), בניגוד ליד הנעלמה של השוק.`},

{t:"מצגת 4 — חוק, CSR וממשל", q:`איך אפשר לפתור את הדילמה של בעיית הנציג בארגון?`,
o:[`יישום עקרונות של רפיון מוסרי`,`יישום עקרון הייחוס עפ"י כהנמן ועמיתיו`,`יישום בירוקרטי`,`יישום עקרון של רלטיביזם מוסרי`,`יישום אחריות שילוחית`],c:2,
e:`הארגון הבירוקרטי (ובר) — חלוקת סמכויות וכללים — נועד לרסן את בעיית הנציג.`},

/* ===== מצגת 5 ===== */
{t:"מצגת 5 — דת, תרבות והתפתחות מוסרית", q:`(דילמת היינץ) אדם פורץ לבית מרקחת וגונב תרופה יקרה כדי להציל את אשתו החולה. באיזה שלב התפתחות מוסרית נמצא מי שמנמק כי המעשה אינו נכון משום שהגנב צפוי לעונש?`,
o:[`בשלב ההנמקה המוסרית הטרום-קונבנציונלית`,`בשלב הדילמה השילוחית`,`בשלב ההנמקה המוסרית הבתר-קונבנציונלית`,`בשלב שבו עקרונות אוניברסליים מנחים אותו`,`בשלב ההנמקה המוסרית הקונבנציונלית`],c:0,
e:`קולברג — נימוק של פחד מעונש הוא הרמה הקדם/טרום-קונבנציונלית (הנמוכה ביותר).`},

{t:"מצגת 5 — דת, תרבות והתפתחות מוסרית", q:`אחריות חברתית אסטרטגית היא:`,

{src:'שלי',t:"מצגת 1 — מבוא ותיאוריות", q:`לפי הקושי ב"יחסיות המוסרית" (רלטיביזם, אצל אריסטו), שיפוט מוסרי:`,

o:[`פועלת אתית מעבר למינימום שהחוק דורש, מתוך בחירה ואחריות`,`עומדת רק במינימום החוקי הנדרש`,`מפרה את החוק באופן שיטתי`,`מתעלמת מאחריות חברתית`,`פועלת אתית רק כשהיא נתבעת`],c:0,
e:`מעבר לציות = עשייה אתית החורגת מעל הרף התחתון של החוק.`},

{src:'שלי',t:"מצגת 3 — ציות ולמידה ארגונית", q:`"צרכנות אכפתית" (Ethical Consumerism) מתארת:`,
o:[`קנייה לפי המחיר הזול ביותר בלבד`,`צריכה ראוותנית של מוצרי יוקרה`,`רכישה אימפולסיבית`,`צרכנים המתנים את רכישותיהם בהתנהלות אתית/חברתית של החברה (כולל החרמת מוצרים לא-אתיים)`,`צמצום מוחלט של כל צריכה`],c:3,

{src:'שלי',t:"מצגת 4 — חוק, CSR וממשל", q:`ההתפתחות ההיסטורית של האחריות התאגידית בשנות ה-80 הושפעה בעיקר מ:`,
o:[`עליית הגישה הניאו-ליברלית (רייגן/תאצ'ר) שהדגישה שוק חופשי וצמצום מעורבות המדינה`,`קריסת השוק החופשי`,`ביטול הקפיטליזם`,`התחזקות הקומוניזם במערב`,`היעלמות התאגידים הרב-לאומיים`],c:0,
e:`שנות ה-80 — ניאו-ליברליזם (שוק חופשי, הפרטה) עיצב מחדש את שיח ה-CSR.`},
];

const L=['א','ב','ג','ד','ה'];
let order=[...BANK.keys()];
let filter='all';
let srcFilter='all';
let idx=0;
const srcOf=i=>BANK[i].src||'מרצה';
let answers={}; // origIndex -> selected
const $=s=>document.querySelector(s);

function topics(){return ['all',...new Set(BANK.map(b=>b.t))];}
function visible(){return order.filter(i=>(filter==='all'||BANK[i].t===filter)&&(srcFilter==='all'||srcOf(i)===srcFilter));}

function buildFilters(){
  const host=$('#filters'); host.innerHTML='';
  topics().forEach(t=>{
    const b=document.createElement('button');
    b.className='chip'+(filter===t?' active':'');
    b.textContent = t==='all' ? 'הכול' : t;
    b.onclick=()=>{filter=t; idx=0; render();};
    host.appendChild(b);
  });
}

function buildSrcFilters(){
  const host=$('#srcfilters'); host.innerHTML='';
  const opts=[['all','כל המקורות'],['מרצה','שאלות המרצה (50)'],['שלי','שאלות נוספות — מיקוד (47)']];
  opts.forEach(([v,label])=>{
    const b=document.createElement('button');
    b.className='chip'+(srcFilter===v?' active':'');
    b.textContent=label;
    b.onclick=()=>{srcFilter=v; idx=0; render();};
    host.appendChild(b);
  });
}

function render(){
  buildFilters();
  buildSrcFilters();
  const vis=visible();
  if(idx>=vis.length) idx=vis.length-1;
  if(idx<0) idx=0;
  const oi=vis[idx];
  const q=BANK[oi];
  const sel=answers[oi];
  const host=$('#qhost');
  host.innerHTML='';
  const meta=document.createElement('div'); meta.className='qmeta'; meta.textContent=q.t;
  const qt=document.createElement('div'); qt.className='qtext'; qt.textContent=(idx+1)+'. '+q.q;
  host.appendChild(meta); host.appendChild(qt);
  q.o.forEach((opt,j)=>{
    const d=document.createElement('div');
    d.className='opt'+(sel!=null?' locked':'');
    if(sel!=null){
      if(j===q.c) d.className+=' correct';
      else if(j===sel) d.className+=' wrong';
    }
    d.innerHTML=`<span class="ltr">${L[j]}</span><span>${opt}</span>`;
    if(sel==null) d.onclick=()=>{answers[oi]=j; render();};
    host.appendChild(d);
  });
  const ex=document.createElement('div');
  ex.className='expl'+(sel!=null?' show':'');
  ex.innerHTML=`<span class="tag">${sel===q.c?'✔ נכון':'✘ שגוי — התשובה הנכונה: '+L[q.c]}</span> — ${q.e}`;
  host.appendChild(ex);

  $('#prev').disabled = idx===0;
  $('#next').disabled = idx>=vis.length-1;
  updateStats(vis);
  buildPalette(vis);
}

function updateStats(vis){
  const ans=vis.filter(oi=>answers[oi]!=null).length;
  const corr=vis.filter(oi=>answers[oi]!=null && BANK[oi].c===answers[oi]).length;
  $('#sIdx').textContent=idx+1;
  $('#sTot').textContent=vis.length;
  $('#sAns').textContent=ans;
  $('#sCorr').textContent=corr;
  $('#sStreak').textContent=streak();
  $('#sScore').textContent = ans? Math.round(corr/ans*100)+'%' : '—';
  $('#bar').style.width=(ans/vis.length*100)+'%';
}

function streak(){
  let s=0;
  for(let i=order.length-1;i>=0;i--){
    const oi=order[i];
    if(answers[oi]==null) continue;
    if(BANK[oi].c===answers[oi]) s++; else break;
  }
  return s;
}

function buildPalette(vis){
  const host=$('#palette'); host.innerHTML='';
  vis.forEach((oi,k)=>{
    const b=document.createElement('button');
    b.className='pbtn'+(k===idx?' cur':'');
    if(answers[oi]!=null) b.className+= BANK[oi].c===answers[oi]?' ok':' bad';
    b.textContent=k+1;
    b.onclick=()=>{idx=k; render();};
    host.appendChild(b);
  });
}

$('#prev').onclick=()=>{idx--; render();};
$('#next').onclick=()=>{idx++; render();};
$('#reset').onclick=()=>{ if(confirm('לאתחל את כל התשובות?')){answers={}; order=[...BANK.keys()]; idx=0; render();} };
$('#shuffle').onclick=()=>{
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  answers={}; idx=0; render();
};
$('#theme').onclick=()=>{
  const h=document.documentElement;
  const dark=h.classList.contains('dark')|| (!h.classList.contains('light') && matchMedia('(prefers-color-scheme:dark)').matches);
  h.classList.remove('dark','light'); h.classList.add(dark?'light':'dark');
};
$('#finish').onclick=()=>{
  const vis=visible();
  const ans=vis.filter(oi=>answers[oi]!=null).length;
  const corr=vis.filter(oi=>answers[oi]!=null && BANK[oi].c===answers[oi]).length;
  const pct=ans?Math.round(corr/ans*100):0;
  let grade = pct>=90?'מצוין! 🏆':pct>=80?'טוב מאוד 👏':pct>=70?'טוב 👍':pct>=60?'עובר ✓':'דורש חזרה 📚';
  const host=$('#qhost');
  host.innerHTML=`<div class="result">
    <div class="big">${pct}%</div>
    <div class="grade">${corr} מתוך ${ans} שנענו · ${grade}</div>
    <div style="color:var(--muted);font-size:14px">${ans<vis.length?('ענית על '+ans+' מתוך '+vis.length+' שאלות'):'ענית על כל '+vis.length+' השאלות'}</div>
  </div>`;
  $('#prev').disabled=true; $('#next').disabled=true;
};

render();
</script>
</body>
</html>
